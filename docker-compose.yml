---
#
# docker-compose.yml: Ollama Deployment for Synology NAS & macOS
#
# This Docker Compose configuration simplifies the setup process for deploying
# Ollama, a local LLM service, along with its WebUI for easy interaction.
#
# Services Included:
#   - Ollama: Provides a local LLM service for AI-driven tasks.
#   - Ollama WebUI: A web-based interface to interact with Ollama's AI models.
#
# Compatible with Synology NAS and macOS for flexible deployment.
#
# For setup instructions and additional configurations, visit:
# - Ollama Setup Guide: https://mariushosting.com/how-to-install-ollama-on-your-synology-nas/
#

#
# Docker Compose version on the target system
#
version: "2.9"

#
# Setup default properties for all or most containers
#
x-default-container: &default-container # YAML anchor for default container
  pull_policy: always                   # Ensure that the image is always pulled
  restart: on-failure:5                 # Restart the container on failure up to 5 times
  security_opt:                         # Configure container security options
    - no-new-privileges:true            # Disallow addition of additional privileges
  logging:                              # Configure container logging options
    driver: "json-file"                 # Use JSON file logging driver
    options:                            # Add container logging options
      max-size: ${LOG_MAX_SIZE}         # Maximum file size for logs files
      max-file: ${LOG_MAX_FILE}         # Maximum number of log files to retain

#
# Define the services section
#
services:
  #
  # Define the 'ollama' service
  #
  ollama:
    # Docker image and container information
    <<: *default-container               # Pull in the default container information
    image: ollama/ollama:${OLLAMA_TAG}   # Run using the specified tag - use 'rocm' tag for AMD CPU instead of 'latest'
    container_name: ollama-${OLLAMA_TAG} # Append Docker image tag to container name
    hostname: ollama                     # Set the container hostname

    # Entrypoint to start the container
    entrypoint: ["/usr/bin/bash", "/entrypoint.sh"]  # Run the entrypoint script with Bash

    # Command used to check container health
    healthcheck:
      test: ["CMD", "ollama", "--version"]             # Check if Ollama responds with its version
      timeout: ${OLLAMA_HEALTHCHECK_TIMEOUT}           # Fail if the check exceeds this timeout
      interval: ${OLLAMA_HEALTHCHECK_INTERVAL}         # Run the check on this interval
      start_period: ${OLLAMA_HEALTHCHECK_START_PERIOD} # Grace period before checks start
      retries: 3                                       # Mark as unhealthy after 3 failures

    # Define the container environment
    environment:
      MODELS: ${OLLAMA_MODELS}                        # Models available for use, e.g., 'llama3.2,gemma2,mistral' (See: https://ollama.com/library)
      OLLAMA_INSTALL_MODELS: ${OLLAMA_INSTALL_MODELS} # Models installed on startup, e.g., 'llama3.2,gemma2,mistral' (See: https://ollama.com/library)
      OLLAMA_HOSTNAME: ${OLLAMA_HOSTNAME}             # Custom hostname for the Ollama service

    # Define the host and container ports
    ports:
      - ${OLLAMA_PORT}:11434 # Ollama API port

    # Mount host directories into the container
    volumes:
      - ${OLLAMA_DATA_PATH}:/root/.ollama:rw     # Mount data directory
      - ${OLLAMA_ENTRYPOINT_PATH}:/entrypoint.sh # Mount entrypoint directory

  #
  # Define the 'ollama-webui' service
  #
  ollama-webui:
    # Docker image and container information
    <<: *default-container                                   # Pull in the default container information
    image: ghcr.io/open-webui/open-webui:${OLLAMA_WEBUI_TAG} # Run using the specified tag
    container_name: ollama-webui-${OLLAMA_WEBUI_TAG}         # Append Docker image tag to container name
    hostname: ollama-webui                                   # Set the container hostname

    # Command used to check container health
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1 # Check if port 8080 is open
      timeout: ${OLLAMA_WEBUI_HEALTHCHECK_TIMEOUT}                     # Fail if it exceeds the specified duration
      interval: ${OLLAMA_WEBUI_HEALTHCHECK_INTERVAL}                   # Run the check at this interval
      start_period: ${OLLAMA_WEBUI_HEALTHCHECK_START_PERIOD}           # Grace period before checks start
      retries: 3                                                       # Mark as unhealthy after 3 failures

    # Define the container environment
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_WEBUI_BASE_URL}    # Base URL for the Ollama service API
      WEBUI_SECRET_KEY: ${OLLAMA_WEBUI_SECRET_KEY} # Secret key for authentication and security

    # Define the host and container ports
    ports:
      - ${OLLAMA_WEBUI_PORT}:8080 # Ollama web UI port

    # Mount host directories into the container
    volumes:
      - ${OLLAMA_WEBUI_CONFIG_PATH}:/app/backend/data:rw # Mount web UI config directory

    # Specify container service dependencies
    depends_on:
      ollama:
        condition: service_healthy # Wait for ollama service healthcheck to report healthy

#
# Define the networks section
#
networks:
  # Configure the default network
  default:
    name: ${COMPOSE_PROJECT_NAME} # Use the name of the compose project
    ipam:                         # IP Address Management
      driver: default             # Use the default driver
      config:
        - subnet: ${COMPOSE_NETWORK_SUBNET}     # Subnet in CIDR format that represents a network segment
          ip_range: ${COMPOSE_NETWORK_IP_RANGE} # Range of IPs from which to allocate container IPs
          gateway: ${COMPOSE_NETWORK_GATEWAY}   # Gateway for the master subnet
